<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendar - Office ERP</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        /* ==========================================
           HEADER
        ========================================== */

        .calendar-header {
            background: #ffffff;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }

        .calendar-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .calendar-header p {
            color: #6b7280;
            font-size: 14px;
        }

        .back-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #1d4ed8;
        }

        /* ==========================================
           YEAR NAVIGATION
        ========================================== */

        .year-navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 25px;
        }

        .year-navigation button {
            width: 40px;
            height: 40px;
            border: none;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 7px;
            cursor: pointer;
            font-size: 20px;
        }

        .year-navigation button:hover {
            background: #f3f4f6;
        }

        #yearTitle {
            font-size: 28px;
            min-width: 100px;
            text-align: center;
        }

        .today-btn {
            padding: 9px 16px;
            background: #2563eb !important;
            color: white;
            font-size: 14px !important;
            width: auto !important;
        }

        /* ==========================================
           YEAR CALENDAR
        ========================================== */

        .year-calendar {
            width: 95%;
            max-width: 1400px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding-bottom: 40px;
        }

        /* ==========================================
           MONTH
        ========================================== */

        .month-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .month-title {
            text-align: center;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .weekdays,
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
        }

        .weekdays div {
            font-size: 11px;
            font-weight: bold;
            color: #6b7280;
            padding: 5px 0;
        }

        .days div {
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border-radius: 50%;
            margin: 2px;
        }

        .days .empty {
            visibility: hidden;
        }

        .days .today {
            background: #2563eb;
            color: white;
            font-weight: bold;
        }

        .days .sunday {
            color: #dc2626;
        }

        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (max-width: 1000px) {

            .year-calendar {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 650px) {

            .calendar-header {
                padding: 15px;
            }

            .calendar-header h1 {
                font-size: 20px;
            }

            .year-calendar {
                grid-template-columns: 1fr;
                width: 92%;
            }

            .year-navigation {
                gap: 10px;
            }

            #yearTitle {
                font-size: 24px;
            }

        }

    </style>

</head>

<body>

    <!-- ==========================================
         HEADER
    ========================================== -->

    <header class="calendar-header">

        <div>
            <h1>Office Calendar</h1>
            <p>Annual Calendar</p>
        </div>

        <button class="back-btn" onclick="goBack()">
            ← Back to Dashboard
        </button>

    </header>


    <!-- ==========================================
         YEAR NAVIGATION
    ========================================== -->

    <div class="year-navigation">

        <button onclick="previousYear()">
            ‹
        </button>

        <h2 id="yearTitle">
            2026
        </h2>

        <button onclick="nextYear()">
            ›
        </button>

        <button class="today-btn" onclick="goToCurrentYear()">
            Current Year
        </button>

    </div>


    <!-- ==========================================
         FULL YEAR CALENDAR
    ========================================== -->

    <main>

        <div
            class="year-calendar"
            id="yearCalendar"
        ></div>

    </main>


    <script>

        // ==========================================
        // CURRENT YEAR
        // ==========================================

        let currentYear = new Date().getFullYear();


        // ==========================================
        // MONTH NAMES
        // ==========================================

        const monthNames = [
            "January",
            "February",
            "March",
            "April",
            "May",
            "June",
            "July",
            "August",
            "September",
            "October",
            "November",
            "December"
        ];


        // ==========================================
        // WEEK DAYS
        // ==========================================

        const weekDays = [
            "Sun",
            "Mon",
            "Tue",
            "Wed",
            "Thu",
            "Fri",
            "Sat"
        ];


        // ==========================================
        // CREATE CALENDAR
        // ==========================================

        function createCalendar() {

            const calendar =
                document.getElementById("yearCalendar");

            const yearTitle =
                document.getElementById("yearTitle");

            calendar.innerHTML = "";

            yearTitle.textContent = currentYear;


            const today = new Date();

            const todayDate = today.getDate();
            const todayMonth = today.getMonth();
            const todayYear = today.getFullYear();


            // Create all 12 months

            for (let month = 0; month < 12; month++) {

                const monthCard =
                    document.createElement("div");

                monthCard.className = "month-card";


                // Month title

                const monthTitle =
                    document.createElement("div");

                monthTitle.className = "month-title";

                monthTitle.textContent =
                    monthNames[month];


                // Weekdays

                const weekdays =
                    document.createElement("div");

                weekdays.className = "weekdays";


                weekDays.forEach(day => {

                    const dayElement =
                        document.createElement("div");

                    dayElement.textContent = day;

                    weekdays.appendChild(dayElement);

                });


                // Days container

                const days =
                    document.createElement("div");

                days.className = "days";


                // First day of month

                const firstDay =
                    new Date(
                        currentYear,
                        month,
                        1
                    ).getDay();


                // Number of days

                const daysInMonth =
                    new Date(
                        currentYear,
                        month + 1,
                        0
                    ).getDate();


                // Empty spaces

                for (
                    let i = 0;
                    i < firstDay;
                    i++
                ) {

                    const empty =
                        document.createElement("div");

                    empty.className = "empty";

                    days.appendChild(empty);

                }


                // Create dates

                for (
                    let date = 1;
                    date <= daysInMonth;
                    date++
                ) {

                    const dateElement =
                        document.createElement("div");

                    dateElement.textContent = date;


                    // Sunday

                    const dayOfWeek =
                        new Date(
                            currentYear,
                            month,
                            date
                        ).getDay();


                    if (dayOfWeek === 0) {

                        dateElement.classList.add(
                            "sunday"
                        );

                    }


                    // Today

                    if (
                        date === todayDate &&
                        month === todayMonth &&
                        currentYear === todayYear
                    ) {

                        dateElement.classList.add(
                            "today"
                        );

                    }


                    days.appendChild(dateElement);

                }


                monthCard.appendChild(monthTitle);

                monthCard.appendChild(weekdays);

                monthCard.appendChild(days);

                calendar.appendChild(monthCard);

            }

        }


        // ==========================================
        // PREVIOUS YEAR
        // ==========================================

        function previousYear() {

            currentYear--;

            createCalendar();

        }


        // ==========================================
        // NEXT YEAR
        // ==========================================

        function nextYear() {

            currentYear++;

            createCalendar();

        }


        // ==========================================
        // CURRENT YEAR
        // ==========================================

        function goToCurrentYear() {

            currentYear =
                new Date().getFullYear();

            createCalendar();

        }


        // ==========================================
        // BACK TO DASHBOARD
        // ==========================================

        function goBack() {

            window.location.href =
                "dashboard.html";

        }


        // ==========================================
        // LOAD CALENDAR
        // ==========================================

        createCalendar();

    </script>

</body>

</html>
