<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Office ERP - Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">

</head>


<body>

    <!-- ==================================================
         MAIN APP
    =================================================== -->

    <div class="app">


        <!-- ==================================================
             TOP NAVBAR
        =================================================== -->

        <header class="topbar">

            <div class="topbar-left">

                <div class="brand">

                    <div class="brand-icon">
                        ERP
                    </div>

                    <div class="brand-text" style="color: black;">

                        <h2>Office ERP</h2>

                    
<span style="color: red;">
    Sysacs Technology Private Limited
</span>



                    </div>

                </div>

            </div>


            <div class="topbar-right">

                <div class="user-info">

                    <div
                        class="user-avatar"
                        id="userAvatar"
                    >
                        S
                    </div>

                    <div class="user-details">

                        <strong id="employeeName">
                            Employee
                        </strong>

                        <span id="employeeId">
                            EMP001
                        </span>

                    </div>

                </div>


                <button
                    type="button"
                    id="logoutBtn"
                    class="logout-btn"
                >
                    Logout
                </button>

            </div>

        </header>



        <!-- ==================================================
             SIDEBAR
        =================================================== -->

        <aside class="sidebar">

            <div class="sidebar-title">
                MAIN MENU
            </div>


            <!-- Dashboard -->

            <button
                type="button"
                class="menu-item active"
                data-page="dashboard"
            >

                <span class="menu-icon">
                    ▦
                </span>

                <span>
                    Dashboard
                </span>

            </button>


            <!-- Employees - ADMIN -->

            <button
                type="button"
                class="menu-item admin-menu"
                data-page="employees"
            >

                <span class="menu-icon">
                    👥
                </span>

                <span>
                    Employees
                </span>

            </button>


            <!-- Attendance -->

            <button
                type="button"
                class="menu-item"
                data-page="attendance"
            >

                <span class="menu-icon">
                    ✓
                </span>

                <span>
                    Attendance
                </span>

            </button>


            <!-- Leave -->

            <button
                type="button"
                class="menu-item"
                data-page="leave"
            >

                <span class="menu-icon">
                    📅
                </span>

                <span>
                    Leave
                </span>

            </button>


            <!-- Tasks -->

            <button
                type="button"
                class="menu-item"
                data-page="tasks"
            >

                <span class="menu-icon">
                    ☑
                </span>

                <span>
                    Tasks
                </span>

            </button>


            <!-- Payroll - ADMIN -->

            <button
                type="button"
                class="menu-item admin-menu"
                data-page="payroll"
            >

                <span class="menu-icon">
                    ₹
                </span>

                <span>
                    Payroll
                </span>

            </button>


            <!-- Reports - ADMIN -->

            <button
                type="button"
                class="menu-item admin-menu"
                data-page="reports"
            >

                <span class="menu-icon">
                    ▤
                </span>

                <span>
                    Reports
                </span>

            </button>


            <!-- Settings - ADMIN -->

            <button
                type="button"
                class="menu-item admin-menu"
                data-page="settings"
            >

                <span class="menu-icon">
                    ⚙
                </span>

                <span>
                    Settings
                </span>

            </button>


            <!-- Calendar -->

            <button
                type="button"
                class="menu-item"
                data-page="calendar"
            >

                <span class="menu-icon">
                    □
                </span>

                <span>
                    Calendar
                </span>

            </button>


            <!-- Sidebar Bottom -->

            <div class="sidebar-bottom">

                <div class="role-box">

                    <span class="role-label">
                        LOGIN ROLE
                    </span>

                    <strong id="userRole">
                        Employee
                    </strong>

                </div>

            </div>

        </aside>



        <!-- ==================================================
             MAIN CONTENT
        =================================================== -->

        <main class="main-content">


            <!-- Page Header -->

            <div class="page-header">

                <div>

                    <h1 id="pageTitle">
                        Dashboard
                    </h1>

                    <p id="pageDescription">
                        Welcome to your Office ERP dashboard.
                    </p>

                </div>


                <!-- CURRENT DATE -->

               <div class="date-box" id="dateBox" >

                    <span>
                        Today
                    </span>

                    <strong id="currentDateFormatted">
                        --
                    </strong>

                </div>

            </div>



            <!-- ==================================================
                 DASHBOARD CARDS
            =================================================== -->

            <section
                id="dashboardCards"
                class="dashboard-cards"
            >


                <!-- Employees -->

                <div
                    class="stat-card admin-card"
                    data-card="employees"
                >

                    <div class="stat-icon">
                        👥
                    </div>

                    <div class="stat-info">

                        <span>
                            Total Employees
                        </span>

                        <strong id="totalEmployees">
                            0
                        </strong>

                    </div>

                </div>


                <!-- Attendance -->

                <div
                    class="stat-card"
                    data-card="attendance"
                >

                    <div class="stat-icon">
                        ✓
                    </div>

                    <div class="stat-info">

                        <span>
                            Attendance
                        </span>

                        <strong id="attendanceCount">
                            0
                        </strong>

                    </div>

                </div>


                <!-- Leave -->

                <div
                    class="stat-card"
                    data-card="leave"
                >

                    <div class="stat-icon">
                        📅
                    </div>

                    <div class="stat-info">

                        <span>
                            Leave Requests
                        </span>

                        <strong id="leaveCount">
                            0
                        </strong>

                    </div>

                </div>


                <!-- Tasks -->

                <div
                    class="stat-card"
                    data-card="tasks"
                >

                    <div class="stat-icon">
                        ☑
                    </div>

                    <div class="stat-info">

                        <span>
                            My Tasks
                        </span>

                        <strong id="taskCount">
                            0
                        </strong>

                    </div>

                </div>

            </section>



            <!-- ==================================================
                 QUICK ACTIONS
            =================================================== -->

            <section
                id="quickActions"
                class="quick-actions"
            >

                <div class="section-heading">

                    <h2>
                        Quick Actions
                    </h2>

                    <p>
                        Quickly access important modules.
                    </p>

                </div>


                <div class="quick-grid">


                    <!-- Employees -->

                    <button
                        type="button"
                        class="quick-card admin-card"
                        data-page="employees"
                    >

                        <span class="quick-icon">
                            👥
                        </span>

                        <span class="quick-title">
                            Employees
                        </span>

                        <span class="quick-description">
                            Manage employees
                        </span>

                    </button>


                    <!-- Attendance -->

                    <button
                        type="button"
                        class="quick-card"
                        data-page="attendance"
                    >

                        <span class="quick-icon">
                            ✓
                        </span>

                        <span class="quick-title">
                            Attendance
                        </span>

                        <span class="quick-description">
                            Manage attendance
                        </span>

                    </button>


                    <!-- Leave -->

                    <button
                        type="button"
                        class="quick-card"
                        data-page="leave"
                    >

                        <span class="quick-icon">
                            📅
                        </span>

                        <span class="quick-title">
                            Leave
                        </span>

                        <span class="quick-description">
                            Apply and manage leave
                        </span>

                    </button>


                    <!-- Tasks -->

                    <button
                        type="button"
                        class="quick-card"
                        data-page="tasks"
                    >

                        <span class="quick-icon">
                            ☑
                        </span>

                        <span class="quick-title">
                            Tasks
                        </span>

                        <span class="quick-description">
                            View your tasks
                        </span>

                    </button>


                </div>

            </section>



            <!-- ==================================================
                 DYNAMIC PAGE CONTENT
            =================================================== -->

            <section
                id="pageContent"
                class="page-content"
            >

                <!-- Dashboard JS will load content here -->

            </section>


        </main>


    </div>



    <!-- ==================================================
         JAVASCRIPT
    =================================================== -->

    <script src="dashboard.js"></script>


</body>

</html>
