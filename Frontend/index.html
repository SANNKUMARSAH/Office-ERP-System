<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Office ERP - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==============================
         LOGIN PAGE
    =============================== -->

    <div class="login-container">

        <div class="login-box">

            <!-- Logo / Heading -->
            <div class="login-header">

                <h1>Office ERP</h1>

                <p>Enterprise Management System</p>

            </div>


            <!-- Login Form -->
            <form id="loginForm">

                <!-- Employee ID -->
                <div class="input-group">

                    <label for="employeeId">
                        Employee ID
                    </label>

                    <input
                        type="text"
                        id="employeeId"
                        placeholder="Enter Employee ID"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Forgot Password -->
                <div class="login-options">

                    <a href="#" id="forgotPassword">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>


            <!-- Login Information -->
            <div class="login-footer">

                <p>
                    Office ERP System
                </p>

                <small>
                    Secure Employee Management Portal
                </small>

            </div>

        </div>

    </div>


    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script src="script.js"></script>

</body>

</html>
